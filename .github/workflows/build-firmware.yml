name: Build TR3000 (padavanonly 6.6 + BBRv3)

permissions:
  contents: write

# 仅本分支推送时构建；master 无可编译源码树
on:
  workflow_dispatch:
    inputs:
      variant:
        description: '要编译哪个硬件变体'
        required: true
        default: all
        type: choice
        options:
          - all      # 三个都编（64M / 112M / 256M）
          - 112M     # 只编 112M ubootmod（多数人这台）
          - 64M      # 只编 64M 原厂 uboot
          - 256M     # 只编 256M 大闪存
  push:
    branches:
      - padavanonly-24.10-6.6
    paths-ignore:
      - "**.md"

concurrency:
  group: tr3000-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      # Vantage 主题固定版本：v1.0.15（2026-11-04）
      VANTAGE_SHA: 9feb1e0d3be8a16bb22a3fc2f62b546676659d7d

    steps:
      # 直接编译本分支源码树，不再 clone 上游覆盖掉定制
      # 不再中途 git clone 上游把这一切覆盖掉。
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # 手动触发时只编选中的变体；push 触发默认 all。
      # 三个变体共用同一轮内核与软件包编译，差别只在 rootfs 组装与镜像，
      # 所以「只编一个」省的是镜像与磁盘时间，不是整轮重编。
      - name: 确定要编译的变体
        id: variants
        run: |
          V="${{ github.event.inputs.variant }}"
          case "$V" in
            all)
              DEVS="cudy_tr3000-v1 cudy_tr3000-v1-ubootmod cudy_tr3000-v1-256mb"
              LABEL="64M+112M+256M";;
            112M)
              DEVS="cudy_tr3000-v1-ubootmod"; LABEL="112M-ubootmod";;
            64M)
              DEVS="cudy_tr3000-v1"; LABEL="64M-原厂uboot";;
            256M)
              DEVS="cudy_tr3000-v1-256mb"; LABEL="256M-大闪存";;
            *)
              echo "未知变体: $V"; exit 1;;
          esac
          echo "devs=$DEVS" >> "$GITHUB_OUTPUT"
          echo "label=$LABEL" >> "$GITHUB_OUTPUT"
          echo "本次编译: $LABEL  ($DEVS)"

      # 缓存键必须来自工作区内的文件哈希：hashFiles() 只认 $GITHUB_WORKSPACE
      # 下的路径，之前写成 hashFiles('/tmp/...') 恒为空串，键恒定 →
      # 缓存存过一次后再也更新不了。

      # Vantage 主题 + 面板：上游已发布 24.10 的 .ipk，但这里要编进固件，
      # 所以按固定 commit 取源码，只拷两个包目录（不整个仓库当 feed，
      # 免把 dev/ tests/ prototypes/ 里的 Makefile 一并索引）。
      - name: 加入 Vantage 主题
        run: |
          git init -q /tmp/vantage
          cd /tmp/vantage
          git remote add origin \
            https://github.com/anothaDev/luci-theme-vantage.git
          git fetch -q --depth 1 origin "$VANTAGE_SHA"
          git checkout -q FETCH_HEAD
          cp -r luci-theme-vantage "$GITHUB_WORKSPACE/package/"
          cp -r luci-app-vantage "$GITHUB_WORKSPACE/package/"
          test -d "$GITHUB_WORKSPACE/package/luci-theme-vantage"
          test -d "$GITHUB_WORKSPACE/package/luci-app-vantage"
          echo "Vantage 两个包已就位"

      - name: 生成缓存种子
        id: seed
        run: |
          H=$(cat feeds.conf.default configs/feeds-pins \
                defconfig/mt7981-ax3000.config \
                target/linux/mediatek/filogic/config-6.6 \
                target/linux/generic/hack-6.6/602-net-tcp_bbr-bbrv3.patch \
              | sha256sum | cut -c1-16)
          echo "hash=$H" >> "$GITHUB_OUTPUT"
          echo "缓存种子: $H"

      - name: 恢复 ccache
        uses: actions/cache/restore@v5
        with:
          path: .ccache
          key: pv-ccache-${{ runner.os }}-${{ steps.seed.outputs.hash }}
          restore-keys: pv-ccache-${{ runner.os }}-

      - name: 恢复 dl
        uses: actions/cache/restore@v5
        with:
          path: dl
          key: pv-dl-${{ runner.os }}-${{ steps.seed.outputs.hash }}
          restore-keys: pv-dl-${{ runner.os }}-

      - name: 恢复工具链
        uses: actions/cache/restore@v5
        with:
          path: staging_dir
          key: pv-toolchain-${{ runner.os }}-${{ steps.seed.outputs.hash }}
          restore-keys: pv-toolchain-${{ runner.os }}-

      - name: 恢复 build_dir
        uses: actions/cache/restore@v5
        with:
          path: build_dir
          key: pv-builddir-${{ runner.os }}-${{ steps.seed.outputs.hash }}
          restore-keys: pv-builddir-${{ runner.os }}-

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev rsync unzip \
            zlib1g-dev file wget python3 zstd ccache swig time

      - name: 安装 Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: 腾出磁盘
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc 2>/dev/null
          sudo rm -rf /usr/local/lib/android 2>/dev/null
          df -h /

      # CONFIG_CCACHE=y 已写进 defconfig；这里把 ccache 目录固定到
      # 工作区内的 .ccache，并限制体积，交给下面的 cache 步骤持久化。
      - name: 配置 ccache
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=3G
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          echo "CCACHE_COMPRESS=1" >> "$GITHUB_ENV"
          ccache --show-stats | head -6

      - name: 生成 .config 并校验包清单
        run: |
          # 默认 LAN 改成 192.168.6.1
          # 默认 LAN IP 已在源码树里改为 192.168.6.1，这里只做确认
          grep -q 'ipaddr:-"192.168.6.1"' \
            package/base-files/files/bin/config_generate || {
            echo '默认 LAN IP 不是 192.168.6.1'; exit 1; }

          cp defconfig/mt7981-ax3000.config .config
          # 一次编译出 TR3000 三个硬件变体（靠 MULTI_PROFILE + PER_DEVICE_ROOTFS）：
          #   v1        64 MiB  原厂 uboot（R47）
          #   v1-ubootmod 112 MiB ubootmod（R47）← 当前在用
          #   v1-256mb  230 MiB 256MB 硬件版（R103）
          T=CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE
          for d in ${{ steps.variants.outputs.devs }}; do
          done

          fail=0
          echo "--- 必须有 ---"
          for s in CONFIG_PACKAGE_adblock-fast \
                   CONFIG_PACKAGE_luci-app-adblock-fast \
                   CONFIG_PACKAGE_luci-theme-argon \
                   CONFIG_PACKAGE_luci-theme-vantage \
                   CONFIG_PACKAGE_luci-app-vantage \
                   CONFIG_PACKAGE_kmod-tcp-bbr; do
            if grep -q "^${s}=y" .config; then
              echo "  OK   $s"
            else
              echo "  MISS $s"; fail=1
            fi
          done

          echo "--- 必须没有 ---"
          for s in luci-app-openclash adguardhome luci-app-adguardhome \
                   luci-app-upnp miniupnpd-nftables luci-app-homeproxy \
                   mihomo dns2socks chinadns-ng ipt2socks microsocks; do
            if grep -q "^CONFIG_PACKAGE_${s}=y" .config; then
              echo "  BAD  $s"; fail=1
            else
              echo "  OK   $s"
            fi
          done

          [ "$fail" -eq 0 ] || { echo "包清单校验失败"; exit 1; }

      - name: 内置配置（sysctl / 默认主题 / opkg）
        run: |
          mkdir -p files/etc/uci-defaults files/etc/opkg
          cp configs/tr3000-sysctl.conf files/etc/sysctl.conf
          cp configs/opkg-arch.conf files/etc/opkg/arch.conf
          D=files/etc/uci-defaults/99_luci-theme-default
          cp configs/99_luci-theme-default "$D"
          cp configs/99_opkg-no-signature \
            files/etc/uci-defaults/99_opkg-no-signature
          chmod 755 files/etc/uci-defaults/99_*
          echo '--- sysctl ---'; cat files/etc/sysctl.conf
          echo '--- opkg arch ---'; cat files/etc/opkg/arch.conf

      # 这个 fork 是在 Windows 上创建/提交的，git 索引里 556 个脚本的
      # mode 被存成了 100644（无执行位），导致 ./scripts/feeds 直接
      # Permission denied (exit 126)。这里在构建前统一补回执行位。
      # 这个 fork 在 Windows 上创建，git 索引里几乎所有脚本都是 100644（无执行位），
      # 而构建过程会直接执行它们。已经踩过三次：
      #   ./scripts/feeds            -> 更新 feeds 失败
      #   ./scripts/config/mconf-cfg.sh -> kconfig 菜单构建失败
      #   ./config/check-uname.sh    -> Config.in 解析失败
      # 所以这里一次覆盖三处：仓库根、scripts/（递归）、config/（递归）。
      # 刻意不碰 tools/：chmod 会刷新 mtime，tools/ 源码一变，
      # 缓存里的主机工具对象全部作废（实测重编 931 个，白费 16 分钟）。
      # 这个 fork 在 Windows 上创建，git 索引把执行位全丢了（289 个文件）。
      # 反复逐个目录补已经踩过三次坑，这里改成按权威清单逐条 chmod：
      # configs/exec-bits.txt 是「openwrt/openwrt @ openwrt-24.10 里 mode=100755
      # 的文件」与本地 git ls-tree 逐条比对的产物，不是按目录猜的。
      - name: 修复执行位
        run: |
          LIST=/tmp/exec-bits.txt
          grep -v '^#' configs/exec-bits.txt | grep -v '^$' > "$LIST"
          n=$(wc -l < "$LIST")
          echo "清单条目: $n"
          xargs -a "$LIST" -r chmod +x 2>/dev/null || true

          miss=0
          while IFS= read -r f; do
            if [ -e "$f" ] && [ ! -x "$f" ]; then
              echo "仍缺执行位: $f"; miss=$((miss + 1))
            fi
          done < "$LIST"
          echo "复查后仍缺执行位: $miss"
          # 只报前 20 条，避免刷屏，但要能看到是哪些
          if [ "$miss" -ne 0 ]; then
            while IFS= read -r f; do
              [ -e "$f" ] && [ ! -x "$f" ] && echo "  $f"
            done < "$LIST" | head -20
            exit 1
          fi
          echo 'OK  清单内全部脚本执行位就位'

      # 另一类执行位问题，和上面那类不是一回事：package/*/root/ 下的文件在
      # git 里是 100644（Windows 建仓丢了权限），但装进固件后必须可执行。
      #
      # 实测后果：luci-app-turboacc-mtk 的 /usr/libexec/rpcd/luci.turboacc 是 644
      # → rpcd 只加载可执行插件 → ubus 里没有 luci.turboacc 这个 object
      # → 页面 5 个 RPC 全部 NotFound → JS 里 features.hasTCPCCA 是 undefined
      # → features.hasTCPCCA.split(' ') 抛 TypeError → 「网络加速」整页报错。
      # 同期受影响的还有 luci-app-wrtbwmon，全仓共 21 个文件。
      #
      # 这里按路径语义规范化，不靠手工清单维护（清单会漏掉新加的包）。
      - name: 规范化包内脚本权限
        run: |
          find package -type f \( \
              -path "*/root/etc/init.d/*" -o \
              -path "*/root/usr/libexec/rpcd/*" -o \
              -path "*/root/usr/bin/*" -o \
              -path "*/root/usr/sbin/*" -o \
              -path "*/root/etc/hotplug.d/*" \
            \) -exec chmod 755 {} + 2>/dev/null || true

          # files/ 里的脚本：not base-files 的 done 用 `sh /etc/rc.local` 执行（644 也行），
          # 但改了 base-files 或有人用 [ -x ] 判断就会静默不执行 → 统一 755 更稳。
          find files -type f \( \
              -path "*/usr/bin/*" -o \
              -path "*/usr/sbin/*" -o \
              -path "*/etc/init.d/*" -o \
              -path "*/etc/rc.local" \
            \) -exec chmod 755 {} + 2>/dev/null || true

          # windows 同步过来的文件常是 777，打 ipk 时原样带进固件
          for d in package files; do
            find "$d" -type f -perm 777 2>/dev/null | while read -r f; do
              case "$f" in
                */etc/init.d/*|*/usr/libexec/rpcd/*|*/usr/bin/*|*/usr/sbin/*)
                  chmod 755 "$f" ;;
                */etc/rc.local)
                  chmod 755 "$f" ;;
                */etc/hotplug.d/*)
                  chmod 755 "$f" ;;
                *)
                  chmod 644 "$f" ;;
              esac
            done
          done

          # 只查 libexec（要可执行），不查 acl.d（是 json 数据，应该 644）
          bad=$(find package files -path "*/libexec/rpcd/*" -type f \
                  ! -perm -u+x 2>/dev/null)
          if [ -n "$bad" ]; then
            echo '❌ 仍有不可执行的 rpcd 插件：'
            echo "$bad"
            exit 1
          fi
          n=$(find package files -path "*/libexec/rpcd/*" -type f \
                2>/dev/null | wc -l)
          echo "OK  $n 个 rpcd 插件全部可执行"

      - name: 归一化换行（CRLF -> LF）
        run: sh configs/normalize-lineendings.sh

      - name: 更新 feeds
        run: |
          ./scripts/feeds update -a
          # 第三方 feeds 固定到 configs/feeds-pins
          # scripts/feeds 只能用分支 clone，所以在 update 之后单独 fetch 再 checkout
          if [ -f configs/feeds-pins ]; then
            while read -r name sha; do
              case "$name" in \#*|"") continue ;; esac
              [ -d "feeds/$name" ] || continue
              if ! git -C "feeds/$name" fetch -q --depth 1 origin "$sha"; then
                echo "pin 失败: $name $sha"; exit 1
              fi
              git -C "feeds/$name" checkout -q FETCH_HEAD
              short=$(git -C "feeds/$name" rev-parse --short HEAD)
              echo "pin feeds/$name -> $short"
            done <configs/feeds-pins
          fi
          ./scripts/feeds install -a
          # kenzok8_small 的 luci-app-fchomo 有递归依赖 bug，必删
          rm -rf feeds/kenzok8_small/luci-app-fchomo
          # feeds 装完后必须用完整包元数据重新解析 .config。
          # 原因：第 13 步写 .config 时 feeds 还没装，像 libwebsockets-full
          # 这种来自 feeds 的符号当时不存在，会被 kconfig 当未知项丢掉。
          #
          # 但 make defconfig 本身在这套环境里不稳定：#143 实测它会把
          # adblock-fast / luci-app-adblock-fast / luci-theme-argon 三个
          # 原本 =y 的包打成 is not set（这三个包符号存在、没有 depends，
          # 属于 kconfig 自身行为异常）。所以不能只跑一次就信它，
          # 必须跑完检查、缺了补回去再跑，最多三轮收敛。
          echo '--- feeds 装完，重新解析 .config（带自愈）---'

          req="CONFIG_PACKAGE_adblock-fast"
          req="$req CONFIG_PACKAGE_luci-app-adblock-fast"
          req="$req CONFIG_PACKAGE_luci-theme-argon"
          req="$req CONFIG_PACKAGE_luci-theme-vantage"
          req="$req CONFIG_PACKAGE_luci-app-vantage"
          req="$req CONFIG_PACKAGE_kmod-tcp-bbr"
          req="$req CONFIG_PACKAGE_libwebsockets-full"
          # 本次新增的包也纳入自愈：tcpdump/tcping 早就在 defconfig 里却从未
          # 进过固件，就是被 make defconfig 丢掉的，不纳入会重蹈覆辙。
          req="$req CONFIG_PACKAGE_luci-theme-aurora"
          # 注意：i18n 包（luci-i18n-*）不用写 req —— luci.mk 用
          # LUCI_BUILD_PACKAGES 在编译时自动带出，metadata 里没有它们的
          # config 块，写进 .config 会被当未知符号丢弃，导致自愈永不收敛。
          req="$req CONFIG_PACKAGE_luci-app-aurora-config"
          req="$req CONFIG_PACKAGE_luci-app-theme-switch"
          req="$req CONFIG_PACKAGE_luci-app-turboacc-mtk"
          req="$req CONFIG_PACKAGE_kmod-bonding"
          req="$req CONFIG_PACKAGE_kmod-tls"
          req="$req CONFIG_PACKAGE_kmod-netlink-diag"
          req="$req CONFIG_PACKAGE_bash"
          req="$req CONFIG_PACKAGE_ip-full"
          req="$req CONFIG_PACKAGE_tcpdump"
          req="$req CONFIG_PACKAGE_tcping"
          req="$req CONFIG_PACKAGE_unzip"
          req="$req CONFIG_PACKAGE_mkf2fs"
          req="$req CONFIG_PACKAGE_f2fsck"
          req="$req CONFIG_PACKAGE_libf2fs"
          req="$req CONFIG_PACKAGE_kmod-usb-net-qmi-wwan"
          req="$req CONFIG_PACKAGE_kmod-usb-wdm"
          # 三个设备变体也纳入自愈（make defconfig 同样可能把它们关掉）
          T=CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE
          req="$req ${T}_cudy_tr3000-v1"
          req="$req ${T}_cudy_tr3000-v1-ubootmod"
          req="$req ${T}_cudy_tr3000-v1-256mb"

          for attempt in 1 2 3; do
            make defconfig </dev/null
            miss=0
            for s in $req; do
              if ! grep -q "^${s}=y" .config; then
                # 追加到文件末尾：kconfig 对同名符号取最后一次赋值
                echo "${s}=y" >> .config
                echo "  第 $attempt 轮补回: $s"
                miss=$((miss + 1))
              fi
            done
            echo "第 $attempt 轮解析完成，补回 $miss 个符号"
            [ "$miss" -eq 0 ] && break
            if [ "$attempt" -eq 3 ]; then
              echo "三轮仍无法收敛"
              for s in $req; do grep -q "^${s}=y" .config || echo "  缺 $s"; done
              exit 1
            fi
          done

          echo '--- 最终复核 ---'
          fail=0
          for s in $req; do
            if grep -q "^${s}=y" .config; then
              echo "  OK   $s"
            else
              echo "  MISS $s"; fail=1
            fi
          done

          # 必须没有的包
          bad="luci-app-openclash adguardhome luci-app-adguardhome"
          bad="$bad luci-app-upnp miniupnpd-nftables"
          bad="$bad luci-app-homeproxy mihomo"
          bad="$bad dns2socks chinadns-ng ipt2socks microsocks"
          for s in $bad; do
            if grep -q "^CONFIG_PACKAGE_${s}=y" .config; then
              echo "  BAD  $s"; fail=1
            fi
          done

          # 必须仍然关闭的 kmod（ALL_KMODS 会把它们顶回来）
          mustoff="kmod-sprd_pcie kmod-pcie_mhi_fb"
          mustoff="$mustoff kmod-qmi_wwan_f kmod-qmi_wwan_m"
          mustoff="$mustoff kmod-qmi_wwan_q kmod-gobinet"
          mustoff="$mustoff kmod-usb-net-rtl8152-vendor"
          for s in $mustoff; do
            if grep -q "^CONFIG_PACKAGE_${s}=m" .config; then
              echo "  BAD  $s 又被打开了"; fail=1
            fi
          done

          [ "$fail" -eq 0 ] || { echo "复核不通过"; exit 1; }
          echo 'OK  feeds 之后包清单复核通过'

      - name: 修 host binutils 的 off64_t
        run: |
          echo 'HOST_CFLAGS += -D_LARGEFILE64_SOURCE' \
            >> toolchain/binutils/Makefile

      - name: 预检 + 下载源码包
        run: |
          make prereq
          make -j"$(nproc)" download V=s \
            || make -j"$(nproc)" download V=s \
            || make -j1 download V=s

      # 内核的 kconfig 阶段要调用 staging_dir/host/bin/m4、flex 等，
      # 这些由 tools/compile 产出。完整 make 会自动先编工具，但直接
      # 跑 target/linux/compile 不会 —— 少了这步会死在
      # "flex: fatal internal error, exec of .../host/bin/m4 failed"。
      - name: 先编主机工具
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make tools/compile -j"$(nproc)" V=s

      # 内核的 Kconfig.include 会检查交叉链接器
      # aarch64-openwrt-linux-musl-ld 是否存在，这由 toolchain/compile
      # 产出。只编 tools 还不够，会把内核步骤卡在
      #   scripts/Kconfig.include:41: linker '...-ld' not found
      # 工具链是本流程里最耗时的一块（4 核约 30~45 分钟），
      # 编完会随 staging_dir 缓存留下来，下次运行直接命中。
      - name: 编交叉工具链
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make toolchain/compile -j"$(nproc)" V=s

      # 先单独编内核：BBRv3 一旦编不过，10 分钟内就暴露，
      # 不用等两小时整套编完才失败。
      # 先单独编内核：BBRv3 一旦编不过，10 分钟内就暴露，
      # 不用等两小时整套编完才失败。
      #
      # padavanonly 树的 999-17xx 系列是 2.5G PHY EEE 的回移补丁，
      # 6.6.133 稳定分支已包含其中部分改动，导致补丁靠 fuzz 硬打、
      # 打到 999-1722 的 hunk #4 就崩。这是上游补丁与新内核的冲突，
      # 不是我们的错。这里做成自愈：打不上的补丁移走、重试，最多 5 个。
      # 拆成两步：
      #   1) prepare —— 只打补丁 + 生成内核 .config，约 2~3 分钟，
      #      在这里做 BBRv3 的全部断言，出问题立刻知道，不用等全量编译
      #   2) compile —— 编内核镜像 + 全部模块（ALL_KMODS 下最耗时的一步）
      #
      # 注意内核目录必须精确定位到目标树：
      #   build_dir/target-<arch>_musl/linux-mediatek_filogic/linux-6.6.133
      # 不能用 -name 'linux-6.6.*' 裸找，否则会先命中工具链里的
      # build_dir/toolchain-..._musl/linux-6.6.133（那份是内核头文件的
      # 副本，.config 里没有 BBR 选项，会造成误判）。
      - name: 内核准备并校验 BBRv3
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          mkdir -p /tmp/skipped-patches
          ok=0
          for round in 1 2 3 4 5; do
            echo "=== 内核准备第 $round 轮 ==="
            if make target/linux/prepare -j"$(nproc)" V=s \
                 > /tmp/kprep.log 2>&1; then
              ok=1; break
            fi
            FAILPAT='Patch failed!|out of [0-9]+ hunks? FAILED'
            if ! grep -qE "$FAILPAT" /tmp/kprep.log; then
              echo '不是补丁问题（无 Patch failed），最后 60 行：'
              tail -60 /tmp/kprep.log
              exit 1
            fi
            P=$(grep -o '/[^ ]*\.patch' /tmp/kprep.log | tail -1)
            if [ -z "$P" ] || [ ! -f "$P" ]; then
              echo '补丁失败但取不到路径，最后 60 行：'
              tail -60 /tmp/kprep.log
              exit 1
            fi
            echo "打不上，跳过：$P"
            mv "$P" "/tmp/skipped-patches/$(basename "$P")"
            rm -rf build_dir/target-*/linux-*/linux-6.6.* || true
          done
          if [ "$ok" -ne 1 ]; then
            echo '连续 5 轮仍有补丁打不上，最后 60 行：'
            tail -60 /tmp/kprep.log
            find /tmp/skipped-patches -maxdepth 1 -type f || true
            exit 1
          fi
          SP=/tmp/skipped-patches
          skipped=$(find "$SP" -maxdepth 1 -type f 2>/dev/null | wc -l)
          echo "跳过的补丁数: $skipped"
          find "$SP" -maxdepth 1 -type f 2>/dev/null || true

          # 精确定位目标内核树
          KDIR=$(find build_dir -maxdepth 4 -type d \
            -path '*target-*/linux-*/linux-6.6.*' | head -1)
          echo "目标内核树: $KDIR"
          [ -n "$KDIR" ] || { echo '找不到目标内核树'; exit 1; }

          BBR="$KDIR/net/ipv4/tcp_bbr.c"
          echo "BBR 源码: $BBR"
          [ -f "$BBR" ] || { echo '找不到 tcp_bbr.c'; exit 1; }
          if ! grep -q 'ecn_alpha' "$BBR"; then
            echo 'BBRv3 补丁没打上'; exit 1
          fi
          echo 'OK  tcp_bbr.c 是 v3 版本'

          # 此时内核 .config 还没生成（prepare 只打补丁），
          # 配置断言放到编译之后，这里只确认源码与开机参数
          grep -q 'tcp_congestion_control=bbr' files/etc/sysctl.conf || {
            echo 'sysctl 未设置 bbr'; exit 1; }
          echo 'OK  BBRv3 源码已就位 + 开机 sysctl 已设置'

      - name: 编译内核与全部模块
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make target/linux/compile -j"$(nproc)" V=s
          KDIR=$(find build_dir -maxdepth 4 -type d \
            -path '*target-*/linux-*/linux-6.6.*' | head -1)
          KC="$KDIR/.config"
          if grep -qE '^CONFIG_TCP_CONG_BBR=[ym]' "$KC" 2>/dev/null; then
            echo "OK  内核已启用 BBR: $(grep -E '^CONFIG_TCP_CONG_BBR=' "$KC")"
          else
            echo 'BBR 未启用（既非 y 也非 m）'
            grep -E 'TCP_CONG_BBR|DEFAULT_TCP_CONG' "$KC" 2>/dev/null || true
            exit 1
          fi
          KO=$(find "$KDIR" -name 'tcp_bbr.ko' 2>/dev/null | head -1)
          if [ -n "$KO" ]; then
            echo "OK  tcp_bbr.ko: $(stat -c%s "$KO") 字节"
          elif grep -qE '^CONFIG_TCP_CONG_BBR=y' "$KDIR/.config"; then
            echo 'OK  BBR 内建进内核（无 .ko，正常）'
          else
            echo '找不到 tcp_bbr.ko 且非内建'; exit 1
          fi

      - name: 编译固件
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          free -h && nproc && df -h /
          set -o pipefail
          # 先严格编：真有问题就立刻暴露
          if make -j"$(nproc)" V=s 2>&1 | tee /tmp/build.log; then
            echo 'OK  一次编过'
          else
            echo '--- 首次失败涉及的包 ---'
            grep -aE '^ERROR: package/' /tmp/build.log | tail -20 || true
            # ALL_KMODS 会把上千个 kmod 都编一遍，其中个别年久失修的
            # 外部驱动编不过是常事。这些包不进固件，只影响包仓库里少几个
            # .ipk，所以用 -k 继续编，别让它们拖死整轮
            echo '--- 改用 -k 继续（只跳过失败的包）---'
            make -k -j"$(nproc)" V=s 2>&1 | tee /tmp/build2.log || true
            echo '--- -k 之后仍失败的包 ---'
            grep -aE '^ERROR: package/' /tmp/build2.log | tail -20 || true
            tail -20 /tmp/build2.log
          fi

      - name: 校验产物（含包仓库）
        run: |
          MDIR=bin/targets/mediatek/filogic
          # 多设备变体：每个变体各自一个 .manifest，逐个校验（不能只取 head -1）
          MS=$(find "$MDIR" -maxdepth 1 -name '*.manifest' | sort)
          [ -n "$MS" ] || { echo '没有 manifest'; exit 1; }
          COUNT=$(printf '%s\n' "$MS" | wc -l)
          echo "发现 $COUNT 个 manifest:"
          echo "$MS"
          for M in $MS; do
            grep -q '^adblock-fast ' "$M" || {
              echo "固件里没有 adblock-fast: $(basename "$M")"; exit 1; }
            for bad in luci-app-openclash adguardhome \
                       luci-app-homeproxy mihomo; do
              if grep -qiE "^${bad} " "$M"; then
                echo "固件里混进了 $bad: $(basename "$M")"; exit 1
              fi
            done
          done
          echo 'OK  所有变体的包清单符合预期'

          # 三个硬件变体的 sysupgrade 镜像必须都在
          for v in ${{ steps.variants.outputs.devs }}; do
                -name "*${v}-squashfs-sysupgrade.bin" | head -1)
            if [ -z "$f" ]; then
              echo "缺变体镜像: $v"; ls "$MDIR"/*.bin 2>/dev/null; exit 1
            fi
            echo "  $(basename "$f")  $(du -h "$f" | cut -f1)"
          done
          echo 'OK  三个变体镜像齐全'

          # ALL_KMODS 是否真的生效：看 packages/ 里的 kmod 数量
          PKG="$MDIR/packages"
          [ -d "$PKG" ] || { echo '没有 packages 目录'; exit 1; }
          KMOD=$(find "$PKG" -maxdepth 1 -name 'kmod-*.ipk' | wc -l)
          ALL=$(find "$PKG" -maxdepth 1 -name '*.ipk' | wc -l)
          echo "包仓库: kmod=$KMOD, 总计=$ALL"
          if [ "$KMOD" -lt 300 ]; then
            echo "ALL_KMODS 似乎没生效（kmod 只有 $KMOD 个）"; exit 1
          fi
          echo 'OK  ALL_KMODS 生效'

      - name: 收集产物
        run: |
          mkdir -p /tmp/out
          MDIR=bin/targets/mediatek/filogic
          # 产物改成一看就懂的通俗名字：TR3000-<哪个版本>-刷机包/救砖包.bin
          for d in ${{ steps.variants.outputs.devs }}; do
            case "$d" in
              cudy_tr3000-v1)          TAG="64M-原厂uboot" ;;
              cudy_tr3000-v1-ubootmod) TAG="112M-ubootmod" ;;
              cudy_tr3000-v1-256mb)    TAG="256M-大闪存" ;;
              *) echo "未知设备: $d"; exit 1 ;;
            esac
            for pair in "squashfs-sysupgrade:刷机包" "initramfs-kernel:救砖包"; do
              src="$MDIR/immortalwrt-mediatek-filogic-${d}-${pair%%:*}.bin"
              dst="/tmp/out/TR3000-${TAG}-${pair##*:}.bin"
              [ -f "$src" ] || { echo "缺产物: $src"; exit 1; }
              cp "$src" "$dst"
              echo "  $(basename "$dst")"
            done
          done
          ( cd /tmp/out && sha256sum *.bin > SHA256SUMS.txt )
          echo '--- 校验值 ---'; cat /tmp/out/SHA256SUMS.txt
          # 打包整个包仓库（含全部 kmod），这是刷完机后自由装包的关键
          tar -C "$MDIR" -I 'zstd -19 -T0' \
            -cf /tmp/out/packages.tar.zst packages
          ls -lh /tmp/out/
          NF=$(find /tmp/out -maxdepth 1 -name 'TR3000-*.bin' | wc -l)
          echo "固件文件: $NF 个"
          echo "包仓库: $(find "$MDIR/packages" -name '*.ipk' | wc -l) 个 ipk"

      - name: 构建信息
        run: |
          echo "BUILD_TIME=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_ENV"
          echo "BUILD_NUM=${{ github.run_number }}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: TR3000-${{ steps.variants.outputs.label }}-${{ env.BUILD_TIME }}
          path: /tmp/out/*

      - uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: tr3000-${{ env.BUILD_TIME }}
          name: >-
            TR3000 固件 ${{ steps.variants.outputs.label }}
            ${{ env.BUILD_TIME }}
          body: |
            **这次编的版本**：${{ steps.variants.outputs.label }}
            （${{ steps.variants.outputs.devs }}）

            **文件名怎么看**
            - `TR3000-<版本>-刷机包.bin`：日常升级用这个
            - `TR3000-<版本>-救砖包.bin`：系统起不来时用
            - `SHA256SUMS.txt`：校验值

            **构建信息**
            - 编号 ${{ github.run_number }} / 触发 ${{ github.event_name }}
            - 提交 ${{ github.sha }}
            - 时间 ${{ env.BUILD_TIME }}
            - 内核 6.6.133 + BBRv3（CachyOS 6.6 移植）
            - 底座 padavanonly/immortalwrt-mt798x-6.6
          files: /tmp/out/*

      - name: 保存 ccache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: .ccache
          key: pv-ccache-${{ runner.os }}-${{ steps.seed.outputs.hash }}

      - name: 保存 dl
        if: always()
        uses: actions/cache/save@v5
        with:
          path: dl
          key: pv-dl-${{ runner.os }}-${{ steps.seed.outputs.hash }}

      - name: 保存工具链
        if: always()
        uses: actions/cache/save@v5
        with:
          path: staging_dir
          key: pv-toolchain-${{ runner.os }}-${{ steps.seed.outputs.hash }}

      - name: 保存 build_dir
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build_dir
          key: pv-builddir-${{ runner.os }}-${{ steps.seed.outputs.hash }}
