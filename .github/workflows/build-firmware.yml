name: Build TR3000 (master 6.18)

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - README.md

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v5

      - name: Clone upstream
        run: |
          git clone --depth 1 --single-branch -b openwrt-24.10-6.6 \
            https://github.com/padavanonly/immortalwrt-mt798x-6.6.git /tmp/src

      - name: Generate cache seed
        run: |
          cat /tmp/src/feeds.conf.default > /tmp/master-seed
          wc -c /tmp/src/defconfig/mt7981-ax3000.config >> /tmp/master-seed

      - name: Restore ccache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/src/.ccache
          key: master-ccache-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}
          restore-keys: master-ccache-${{ runner.os }}-

      - name: Restore dl cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/src/dl
          key: master-dl-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}
          restore-keys: master-dl-${{ runner.os }}-

      - name: Restore toolchain cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/src/staging_dir
          key: master-toolchain-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}
          restore-keys: master-toolchain-${{ runner.os }}-

      - name: Restore build cache
        uses: actions/cache/restore@v5
        with:
          path: /tmp/src/build_dir
          key: master-builddir-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}
          restore-keys: master-builddir-${{ runner.os }}-


      - name: Apply TR3000 config
        working-directory: /tmp/src
        run: |
          sed -i "s/192.168.110.1/192.168.6.1/g" package/base-files/files/bin/config_generate
          echo "src-git kenzok8 https://github.com/kenzok8/openwrt-packages.git" >> feeds.conf.default
          echo "src-git kenzok8_small https://github.com/kenzok8/small.git" >> feeds.conf.default
          cat >> defconfig/mt7981-ax3000.config << 'PKGEOF'
          CONFIG_PACKAGE_luci-app-homeproxy=y
          CONFIG_PACKAGE_luci-i18n-homeproxy-zh-cn=y
          CONFIG_PACKAGE_luci-app-adblock=y
          CONFIG_PACKAGE_adblock=y
          CONFIG_PACKAGE_luci-i18n-adblock-zh-cn=y
          CONFIG_PACKAGE_luci-app-ddns=y
          CONFIG_PACKAGE_luci-i18n-ddns-zh-cn=y
          CONFIG_PACKAGE_ddns-scripts=y
          CONFIG_PACKAGE_ddns-scripts-services=y
          CONFIG_PACKAGE_luci-app-wol=y
          CONFIG_PACKAGE_luci-i18n-wol-zh-cn=y
          CONFIG_PACKAGE_luci-app-upnp=y
          CONFIG_PACKAGE_miniupnpd-nftables=y
          CONFIG_PACKAGE_luci-i18n-upnp-zh-cn=y
          CONFIG_PACKAGE_luci-app-dufs=y
          CONFIG_PACKAGE_dufs=y
          CONFIG_PACKAGE_luci-i18n-dufs-zh-cn=y
          CONFIG_PACKAGE_luci-app-bandix=y
          CONFIG_PACKAGE_bandix=y
          CONFIG_PACKAGE_luci-i18n-bandix-zh-cn=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-i18n-store-zh-cn=y
          CONFIG_PACKAGE_wsdd2=y
          CONFIG_PACKAGE_tcping=y
          CONFIG_PACKAGE_luci-theme-aurora=y
          CONFIG_PACKAGE_luci-app-aurora-config=y
          CONFIG_PACKAGE_luci-i18n-aurora-config-zh-cn=y
          CONFIG_PACKAGE_coreutils=y
          CONFIG_PACKAGE_coreutils-base64=y
          CONFIG_PACKAGE_luci-compat-keep=y
          CONFIG_PACKAGE_zoneinfo-core=y
          CONFIG_PACKAGE_zoneinfo-asia=y
          CONFIG_PACKAGE_kmod-mtd-rw=y
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-package-manager-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-turboacc-mtk-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-wrtbwmon-zh-cn=y
          CONFIG_CCACHE=y
          CONFIG_PACKAGE_mihomo=n
          CONFIG_PACKAGE_v2ray-geoip=n
          PKGEOF
          mkdir -p files/etc
          echo "net.ipv4.tcp_congestion_control=bbr" > files/etc/sysctl.conf
          echo "net.netfilter.nf_conntrack_max=65536" >> files/etc/sysctl.conf

      - name: Verify device name
        working-directory: /tmp/src
        run: |
          if grep -q "cudy_tr3000" target/linux/mediatek/filogic/image/mediatek.mk; then
            echo "✅ Device found"
          else
            echo "⚠️ Listing available devices:"
            grep "define Device" target/linux/mediatek/filogic/image/mediatek.mk | head -10 || true
          fi

      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev rsync unzip \
            zlib1g-dev file wget python3 zstd ccache

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android 2>/dev/null
          df -h

      - name: Build
        working-directory: /tmp/src
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          # Fix binutils off64_t on glibc where _FILE_OFFSET_BITS=64 hides it
          echo 'HOST_CFLAGS += -D_LARGEFILE64_SOURCE' >> toolchain/binutils/Makefile
          ./scripts/feeds update -a && ./scripts/feeds install -a
          # Fix kenzok8 luci-app-fchomo recursive dependency bug
          rm -rf feeds/kenzok8_small/luci-app-fchomo 2>/dev/null || true
          cp defconfig/mt7981-ax3000.config .config
          echo "CONFIG_TARGET_mediatek_filogic_DEVICE_cudy_tr3000-v1-ubootmod=y" >> .config
          make defconfig
          make prereq
          echo "📥 Downloading packages..."
          make -j$(nproc) download V=s || make -j$(nproc) download V=s || make -j1 download V=s

          # kernel 6.18 has native BBRv3, no injection needed
          echo "=== Resources ===" && free -h && nproc && df -h
          echo "🚀 Building..."
          make -j$(nproc) V=s || make -j1 V=s

      - name: Show build errors
        if: failure()
        run: |
          echo "Check Actions console for full build log"
          df -h

      - name: Collect
        if: success()
        working-directory: /tmp/src
        run: |
          mkdir -p /tmp/out
          if cp bin/targets/mediatek/filogic/*cudy* /tmp/out/ 2>/dev/null; then
            echo "✅ Collected"
            ls -lh /tmp/out/
          else
            echo "❌ No firmware!"
            exit 1
          fi

      - name: Generate release info
        if: success()
        run: |
          echo "BUILD_TIME=$(date '+%Y%m%d-%H%M%S')" >> $GITHUB_ENV
          echo "BUILD_NUM=${{ github.run_number }}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v5
        if: success()
        with:
          name: tr3000-master-firmware-${{ env.BUILD_TIME }}
          path: /tmp/out/*

      - uses: softprops/action-gh-release@v3
        if: success()
        with:
          tag_name: tr3000-master-${{ env.BUILD_TIME }}
          name: TR3000 Master Build #${{ env.BUILD_NUM }}
          body: |
            **构建信息**
            - 编号: ${{ github.run_number }}
            - 触发: ${{ github.event_name }}
            - 提交: ${{ github.sha }}
            - 时间: ${{ env.BUILD_TIME }}
          files: /tmp/out/*

      - name: Save ccache
        uses: actions/cache/save@v5
        with:
          path: /tmp/src/.ccache
          key: master-ccache-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}

      - name: Save dl cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/src/dl
          key: master-dl-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}

      - name: Save build cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/src/build_dir
          key: master-builddir-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}

      - name: Save toolchain cache
        uses: actions/cache/save@v5
        with:
          path: /tmp/src/staging_dir
          key: master-toolchain-${{ runner.os }}-${{ hashFiles('/tmp/master-seed') }}
