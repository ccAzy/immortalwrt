# stubby 手写配置（配合 uci stubby.global.manual='1'）
#
# 上游选择依据（2026-11-06 实测：真 TLS 握手 + 真查询，不是只 tcping 853）：
#   223.5.5.5     阿里     DoT 853 TLS1.3 证书OK  查询 GOOD 1~2s   ✅
#   223.6.6.6     阿里备   DoT 853 通                              ✅
#   120.53.53.53  腾讯     DoT 853 TLS1.2 *.doh.pub OK 查询 GOOD  ✅（dot.pub 解析出的端点）
#
# —— 实测不可用，别再加回来 ——
#   119.29.29.29  腾讯传统DNS，只有 tcp/53 没有 DoT，且本机到它 tcp/53 首连 2.1s
#   1.1.1.1       CF 853 TCP 靠 SYN 重传才建连（一半请求 1.05s），TLS 握手完不成；
#                  DoH 443 也不通：1.1.1.1 http=000 8s 超时，
#                  cloudflare-dns.com 0.46s 被重置
#   1.0.0.1 / 8.8.8.8 / 9.9.9.9  853 全部失败
#
# round_robin_upstreams=0：按顺序优先用阿里，失败切阿里备，再切腾讯。
# 阿里有 ECS 支持、延迟最低；腾讯作为第二家运营商生态兜底。
#
# 注意：这两项必须同时存在，缺一个就 YAML 解析失败：
#   - dns_transport_list
#   - listen_addresses

resolution_type: GETDNS_RESOLUTION_STUB
round_robin_upstreams: 0
appdata_dir: "/var/lib/stubby"
trust_anchors_backoff_time: 2500
tls_authentication: GETDNS_AUTHENTICATION_REQUIRED
tls_query_padding_blocksize: 128
edns_client_subnet_private: 1
idle_timeout: 10000

dns_transport_list:
  - GETDNS_TRANSPORT_TLS

listen_addresses:
  - 127.0.0.1@5453

upstream_recursive_servers:
  - address_data: 223.5.5.5
    tls_auth_name: "dns.alidns.com"
  - address_data: 223.6.6.6
    tls_auth_name: "dns.alidns.com"
  - address_data: 120.53.53.53
    tls_auth_name: "dot.pub"
